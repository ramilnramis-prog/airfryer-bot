{% extends "base.html" %}
{% block title %}New product{% endblock %}
{% block content %}
<h1>New product</h1>
<form action="/b2b/products/new" method="post" enctype="multipart/form-data">
  <label>Client name<input name="client_name" required></label>
  <label>Product name<input name="product_name" required></label>
  <label>Marketplace
    <select name="marketplace">
      {% for m in marketplaces %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
    </select>
  </label>
  <label>Marketplace article<input name="marketplace_article"></label>
  <label>Marketplace URL<input name="marketplace_url"></label>
  <label>Category<input name="category"></label>
  <label>Target audience<textarea name="target_audience" rows="2"></textarea></label>
  <label>Main pain<textarea name="main_pain" rows="2"></textarea></label>
  <label>Product description<textarea name="product_description" rows="4"></textarea></label>
  <label>Product reference images (front/top/side/detail/packaging photos)
    <input type="file" name="reference_images" multiple accept="image/*">
  </label>
  <p class="muted">Загруженные фото попадут в references/ со статусом approved=false --
     подтвердить их нужно будет на странице продукта (минимум 3 approved перед генерацией).</p>
  <button type="submit">Create product</button>
</form>
{% endblock %}
