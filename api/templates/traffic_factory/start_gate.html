{% extends "b2b/base.html" %}
{% block title %}Доступ к сервису{% endblock %}
{% block content %}
<h1>Создать контент-пакет</h1>

{% if error %}
<div class="card">
  <p>Сейчас сервис работает в beta-режиме. Напишите нам, чтобы получить доступ.</p>
</div>
{% endif %}

<div class="card">
  <p>Введите код доступа</p>
  <form action="/traffic-factory/start" method="post">
    <label>Код доступа<input name="access_code" required></label>
    <button type="submit">Продолжить</button>
  </form>
</div>
{% endblock %}
